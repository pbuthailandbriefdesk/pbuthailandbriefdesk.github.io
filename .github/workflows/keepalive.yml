# Free Supabase projects pause after about a week with no activity.
# This reads one row once a day so the Brief Desk database never goes idle.
# It uses the same public (publishable) key the website uses, taken from src/config.js.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 1 * * *'   # every day 01:17 UTC (08:17 Bangkok)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one row from Supabase
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL = '\([^']*\)'.*/\1/p" src/config.js)
          KEY=$(sed -n "s/.*SUPABASE_ANON_KEY = '\([^']*\)'.*/\1/p" src/config.js)
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/desk_team?select=email&limit=1")
          echo "Supabase answered HTTP $code"
          if [ "$code" != "200" ]; then
            cat /tmp/out.json
            echo "::error::Supabase did not answer 200. If the project is paused, restore it in the Supabase dashboard."
            exit 1
          fi
