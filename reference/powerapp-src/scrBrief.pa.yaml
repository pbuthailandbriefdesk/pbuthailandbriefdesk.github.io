                  OnSelect: =Remove(BriefAds, ThisItem)
                  Width: =28
                  X: =Parent.TemplateWidth - 44
                  Y: =46
      - brPanel:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(241, 243, 248, 1)
            Height: =Parent.Height - 64
            Width: =372
            X: =Parent.Width - 372
            Y: =64
      - brPanelTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(16, 20, 61, 1)
