            Width: =330
            X: =Parent.Width - 352
            Y: =76
      - brLeadVal:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(16, 20, 61, 1)
            Font: =Font.'Segoe UI'
            Height: =10
            Size: =11
            Text: |-
              =With(
                  {d: DateDiff(Today(), If(varBrief.BriefType in ["Extension", "Update"] && !IsBlank(varBrief.EffectiveDate), varBrief.EffectiveDate, varBrief.LaunchDate), TimeUnit.Days)},
                  If(
                      IsBlank(varBrief.LaunchDate) || d <= 0,
                      0,
                      Max(
                          0,
                          CountRows(
                              Filter(
                                  ForAll(Sequence(d, 0) As s, DateAdd(Today(), s.Value, TimeUnit.Days)) As x,
                                  Weekday(x.Value, StartOfWeek.Monday) < 6 && !(Text(x.Value, "yyyy-mm-dd") in colHolidays.HDay)
                              )
                          ) - If(Hour(Now()) >= nfCutOffHour && Weekday(Today(), StartOfWeek.Monday) < 6 && !(Text(Today(), "yyyy-mm-dd") in colHolidays.HDay), 1, 0)
                      )
                  )
              )
            Visible: =false
            Width: =10
            X: =Parent.Width - 352
            Y: =76
      - brLead:
          Control: Label@2.5.1
          Properties:
            Color: =If(Value(brLeadVal.Text) >= nfMinLeadDays || (varBrief.IsException = "Yes" && !IsBlank(varBrief.ExceptionApprover)), RGBA(21, 128, 61, 1), RGBA(196, 40, 40, 1))
            Font: =Font.'Segoe UI'
            Height: =44
            Size: =10
            Text: |-
              ="Lead time: " & brLeadVal.Text & " working days" &
              If(
                  Value(brLeadVal.Text) < nfMinLeadDays,
                  If(varBrief.IsException = "Yes" && !IsBlank(varBrief.ExceptionApprover), "  ·  exception approved", "  ·  under " & nfMinLeadDays & ": needs an approved exception"),
                  ""
              )
            Width: =330
