          Properties:
            Color: =RGBA(16, 20, 61, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Size: =17
            Text: ="Brief  ·  " & varBrief.BriefID & "  ·  v" & varBrief.BriefVersion
            Width: =Parent.Width - 460
            X: =If(true, 64, 24)
            Y: =12
      - brUser:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(122, 128, 155, 1)
            Font: =Font.'Segoe UI'
            Height: =24
            Size: =10
            Text: =User().FullName & "  ·  " & nfRole
            Width: =320
            X: =Parent.Width - 344
            Y: =20
      - brBack:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Back"
            Color: =RGBA(16, 20, 61, 1)
            Height: =32
            Icon: =Icon.ChevronLeft
            OnSelect: =Back()
            Width: =32
            X: =16
            Y: =16
      - brTabCampaign:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =If(varBriefTab = "Campaign", Color.White, nfNavy)
            Fill: =If(varBriefTab = "Campaign", nfNavy, RGBA(241, 243, 248, 1))
            Font: =Font.'Segoe UI'
            Height: =34
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: =Set(varBriefTab, "Campaign")
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: ="Campaign"
            Width: =140
            X: =24
            Y: =76
      - brDelete:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(200, 40, 40, 1)
            BorderThickness: =1
            Color: =If(varConfirmDel, Color.White, RGBA(200, 40, 40, 1))
            Fill: =If(varConfirmDel, RGBA(200, 40, 40, 1), RGBA(255, 255, 255, 1))
            Font: =Font.'Segoe UI'
            Height: =34
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: |-
              =If(
                  !varConfirmDel,
                  Set(varConfirmDel, true),
                  Set(varConfirmDel, false);
                  If(
                      IsBlank(varBrief.SubmittedAt),
                      RemoveIf(BriefAds, BriefID = varBrief.BriefID);
                      RemoveIf(BriefAdGroups, BriefID = varBrief.BriefID);
                      RemoveIf(BriefLines, BriefID = varBrief.BriefID);
                      RemoveIf(BriefIOs, BriefID = varBrief.BriefID);
                      RemoveIf(BriefEvents, BriefID = varBrief.BriefID);
                      Remove(Briefs, LookUp(Briefs, ID = varBrief.ID));
                      Notify("Draft deleted", NotificationType.Success),
                      Set(varBrief, Patch(Briefs, varBrief, {Status: "Cancelled"}));
                      Patch(BriefEvents, Defaults(BriefEvents), {BriefID: varBrief.BriefID, Event: "Brief cancelled", ByEmail: nfMeEmail, At: Now(), Detail: ""});
                      Notify("Brief cancelled", NotificationType.Success)
                  );
                  Navigate(scrHome, ScreenTransition.None)
              )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: =If(varConfirmDel, "Click again to confirm", If(IsBlank(varBrief.SubmittedAt), "Delete draft", "Cancel brief"))
            Visible: =varBrief.Status in ["Draft", "Returned"] && (varBrief.PlannerEmail = nfMeEmail || nfRole = "Admin")
            Width: =170
            X: =Parent.Width - 396 - 170
            Y: =76
      - brStatus:
          Control: Label@2.5.1
          Properties:
            Color: =If(varBrief.Status = "Returned", RGBA(161, 98, 7, 1), nfNavy)
            Font: =Font.'Segoe UI'
            Height: =34
            Size: =10
            Text: |-
              ="Status: " & varBrief.Status & If(!IsBlank(varBrief.GateGaps) && varBrief.Status = "Returned", "  ·  Gaps from the Gate: " & varBrief.GateGaps, "")
