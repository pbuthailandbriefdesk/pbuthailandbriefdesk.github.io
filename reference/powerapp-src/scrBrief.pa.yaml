                    If(varIO.Channel = "YouTube" && Len(ThisItem.Headline) > 15, "✗ headline over 15 characters", "")
                  Width: =(Parent.TemplateWidth - 124)
                  X: =60 + (Parent.TemplateWidth - 124) * 0
                  Y: =220
