                      DealType: If(varIO.Channel = "YouTube", "Youtube", "OpenEx"),
                      Gender: "M-W",
                      Language: "Thai",
                      Device: "All",
                      Environment: "All",
                      Sustainability: "No optimisation",
                      ServiceDisc: "NO",
                      StartDate: varIO.StartDate,
                      EndDate: varIO.EndDate
