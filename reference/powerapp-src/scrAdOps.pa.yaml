Screens:
  scrAdOps:
    Properties:
      Fill: =RGBA(247, 248, 251, 1)
      Height: =Max(App.Height, 560)
      OnVisible: =Set(varBrief, LookUp(Briefs, ID = varBrief.ID)); Set(varAOTodo, false)
      Width: =Max(App.Width, 1024)
    Children:
      - aoHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Color.White
            Height: =64
            Width: =Parent.Width
      - aoHeaderLine:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =nfGreen
            Height: =3
            Width: =Parent.Width
            Y: =61
      - aoHeaderMark:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =nfNavy
            Height: =61
            Width: =4
      - aoTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(16, 20, 61, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Size: =17
            Text: ="Ad Ops taxonomy  ·  " & varBrief.BriefID
            Width: =Parent.Width - 460
            X: =If(true, 64, 24)
            Y: =12
      - aoUser:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(122, 128, 155, 1)
            Font: =Font.'Segoe UI'
            Height: =24
            Size: =10
            Text: =User().FullName & "  ·  " & nfRole
            Width: =320
            X: =Parent.Width - 344
            Y: =20
      - aoBack:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Back"
            Color: =RGBA(16, 20, 61, 1)
            Height: =32
            Icon: =Icon.ChevronLeft
            OnSelect: =Back()
            Width: =32
            X: =16
            Y: =16
      - aoSumBrand:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(16, 20, 61, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =26
            Text: =varBrief.Brand & "  ·  " & varBrief.Team & "  ·  " & varBrief.AdvertiserName & " (" & varBrief.Advertiser & ")"
            Width: =Parent.Width - 420
            Wrap: =false
            X: =24
            Y: =76
      - aoSumLine:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(74, 80, 112, 1)
            Font: =Font.'Segoe UI'
            Height: =22
            Size: =10
            Text: |-
              ="Planner " & varBrief.PlannerName &
              "  ·  Flight " & Text(varBrief.LaunchDate, "dd mmm yy") & " – " & Text(varBrief.EndDate, "dd mmm yy") &
              "  ·  THB " & Text(varBrief.TotalBudget, "#,##0") &
              "  ·  " & varBrief.Objective & " / " & varBrief.KPIModel & " " & varBrief.KPITarget &
              "  ·  " & CountRows(Filter(BriefIOs, BriefID = varBrief.BriefID)) & " IO"
            Width: =Parent.Width - 420
            Wrap: =false
            X: =24
            Y: =104
      - aoSumDraft:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(74, 80, 112, 1)
            Font: =Font.'Segoe UI'
            Height: =22
            Size: =10
            Text: |-
              =If(IsBlank(varBrief.Notes), "Notes: –", "Notes: " & If(Len(varBrief.Notes) > 180, Left(Substitute(varBrief.Notes, Char(10), " "), 180) & "…", Substitute(varBrief.Notes, Char(10), " ")))
            Width: =Parent.Width - 420
            Wrap: =false
            X: =24
            Y: =128
      - aoLCamp:
          Control: Label@2.5.1
          Properties:
            Color: =nfBlue
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =20
            Size: =10
            Text: ="Campaign name (L'Oréal taxonomy)"
            Width: =600
            X: =24
            Y: =160
      - aoCamp:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(203, 208, 222, 1)
            Default: =Coalesce(varBrief.CampaignTaxonomy, varBrief.CampaignName)
            Font: =Font.'Segoe UI'
            Height: =36
            OnChange: |-
              =Set(varBrief, Patch(Briefs, varBrief, {CampaignTaxonomy: Self.Text}))
            Size: =11
            Width: =Parent.Width - 420
            X: =24
            Y: =182
      - aoCampSug:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(122, 128, 155, 1)
            Font: =Font.'Segoe UI'
            Height: =22
            Size: =9
            Text: |-
              ="Suggested: " & Lower(Substitute(Coalesce(LookUp(Brands, BrandName = varBrief.Brand).BrandCode, "X") & "_" & Coalesce(LookUp(nfCats, Name = varBrief.Category).Abv, "X") & "_" & Coalesce(varBrief.Franchise, "X") & "_" & Coalesce(varBrief.CampaignDesc, "X") & If(IsBlank(varBrief.CampaignOther), "", "_" & varBrief.CampaignOther), " ", "-"))
            Width: =Parent.Width - 420 - 80
            Wrap: =false
            X: =24
            Y: =222
      - aoCampUse:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =Color.White
            Fill: =nfBlue
            Font: =Font.'Segoe UI'
            Height: =22
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: |-
              =Set(varBrief, Patch(Briefs, varBrief, {CampaignTaxonomy: Lower(Substitute(Coalesce(LookUp(Brands, BrandName = varBrief.Brand).BrandCode, "X") & "_" & Coalesce(LookUp(nfCats, Name = varBrief.Category).Abv, "X") & "_" & Coalesce(varBrief.Franchise, "X") & "_" & Coalesce(varBrief.CampaignDesc, "X") & If(IsBlank(varBrief.CampaignOther), "", "_" & varBrief.CampaignOther), " ", "-"))})); Reset(aoCamp)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =9
            Text: ="Use"
            Width: =64
            X: =Parent.Width - 420 - 40
            Y: =222
      - aoLLines:
          Control: Label@2.5.1
          Properties:
            Color: =nfBlue
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =20
            Size: =10
            Text: |-
              ="Every level: name · action · DV360 ID (for anything that already exists)"
            Width: =900
            X: =24
            Y: =256
      - aoLines:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - Self.Y - 8
            Items: |-
              =With({T: Sort(Ungroup(Table(
              {r: ForAll(Filter(BriefIOs, BriefID = varBrief.BriefID) As i, {Lvl: "IO", Ord: i.IONo * 100000000, IONo: i.IONo, LineNo: 0, AGNo: 0, AdNo: 0, Indent: 0, Bud: i.Budget, Act: i.Action, DvId: i.DV360Id,
                  Label: If(IsBlank(i.Action), "", "[" & i.Action & "] ") & "IO " & i.IONo & " · " & i.IOType & If(IsBlank(i.IOFormat), "", " · " & i.IOFormat) & " · THB " & Text(i.Budget, "#,##0") & " · " & Text(i.StartDate, "dd mmm") & " – " & Text(i.EndDate, "dd mmm yy") & " · " & i.BuyingType & If(IsBlank(i.DealID), "", " " & i.DealID) & " · " & i.KPIModel & " " & i.KPITarget,
                  Detail: "Pacing " & i.Pacing & "  ·  Freq cap " & If(IsBlank(i.FreqExposures), Coalesce(i.FreqCap, "–"), i.FreqExposures & " / " & i.FreqPeriod) & If(IsBlank(i.SegmentStart), "", "  ·  Segment " & Text(i.SegmentStart, "dd mmm") & " – " & Text(i.SegmentEnd, "dd mmm yy") & " (prior THB " & Text(Coalesce(i.PriorBudget, 0), "#,##0") & ")") & "  ·  Verification " & Coalesce(i.Verification, "–"),
                  Nm: i.IOName, Sug: Lower(Substitute(Coalesce(LookUp(Brands, BrandName = varBrief.Brand).BrandCode, "X") & "_" & Coalesce(LookUp(nfCats, Name = varBrief.Category).Abv, "X") & "_" & Coalesce(varBrief.Franchise, "X") & "_" & Coalesce(varBrief.CampaignDesc, "X") & "_" & Coalesce(i.IOType, "X") & "-" & Coalesce(LookUp(nfObjs, Name = i.IOObjective).Abv, "X") & "-" & Coalesce(i.KPIModel, "X") & If(IsBlank(i.IOOther), "", "_" & i.IOOther), " ", "-"))})},
              {r: ForAll(Filter(BriefLines, BriefID = varBrief.BriefID) As l, {Lvl: "LI", Ord: l.IONo * 100000000 + l.LineNo * 100000, IONo: l.IONo, LineNo: l.LineNo, AGNo: 0, AdNo: 0, Indent: 1, Bud: l.Budget, Act: l.Action, DvId: l.DV360Id,
                  Label: If(IsBlank(l.Action), "", "[" & l.Action & "] ") & "Line item " & l.IONo & "." & l.LineNo & " · " & l.Format & " · THB " & Text(l.Budget, "#,##0") & " · " & Text(l.StartDate, "dd mmm") & " – " & Text(l.EndDate, "dd mmm yy") & " · " & l.BidStrategy & " " & l.BidTarget,
                  Detail: Coalesce(l.Inventory, "") & If(IsBlank(l.Audience), "", "  ·  Targeting: " & l.Audience) & If(IsBlank(l.Exclusions), "", "  ·  Excl: " & l.Exclusions),
                  Nm: l.LineItemName, Sug: Lower(Substitute(Coalesce(l.DealType, "X") & If(l.DealType = "Youtube", "-" & Coalesce(l.YTLIType, "X"), "") & "_" & Coalesce(LookUp(nfAuds, Name = l.AudTargeting).AudType, "X") & "-" & Coalesce(LookUp(nfAuds, Name = l.AudTargeting).Abv, "X") & "_" & Coalesce(l.AudTactic, "X") & "_" & Coalesce(l.Gender, "X") & "_" & Coalesce(Text(l.AgeMin), "X") & "-" & Coalesce(Text(l.AgeMax), "X") & "_" & Coalesce(LookUp(nfLangs, Name = l.Language).Abv, "X") & "_" & Coalesce(LookUp(nfDevices, Name = l.Device).Abv, "X") & "_" & Coalesce(l.Environment, "X") & "_" & Coalesce(l.Dims, "X") & "_" & Coalesce(LookUp(nfSust, Name = l.Sustainability).Abv, "X") & If(l.ServiceDisc = "YES", "_SERVICE", "") & "_" & Coalesce(l.PublisherName, "X"), " ", "-"))})},
              {r: ForAll(Filter(BriefAdGroups, BriefID = varBrief.BriefID) As g, {Lvl: "AG", Ord: g.IONo * 100000000 + g.LineNo * 100000 + g.AGNo * 100, IONo: g.IONo, LineNo: g.LineNo, AGNo: g.AGNo, AdNo: 0, Indent: 2, Bud: 0, Act: g.Action, DvId: g.DV360Id,
                  Label: If(IsBlank(g.Action), "", "[" & g.Action & "] ") & "Ad group " & g.IONo & "." & g.LineNo & "." & g.AGNo & " · " & g.Audience,
                  Detail: Coalesce(g.Demographics, "") & If(IsBlank(g.Notes), "", "  ·  " & g.Notes),
                  Nm: g.AdGroupName, Sug: Lower(Substitute(Coalesce(LookUp(nfAuds, Name = g.AudTargeting).AudType, "X") & "-" & Coalesce(LookUp(nfAuds, Name = g.AudTargeting).Abv, "X") & "_" & Coalesce(g.AudTactic, "X") & "_" & Coalesce(g.Gender, "X") & "_" & Coalesce(Text(g.AgeMin), "X") & "-" & Coalesce(Text(g.AgeMax), "X") & "_" & Coalesce(LookUp(nfLangs, Name = g.Language).Abv, "X") & "_" & Coalesce(g.VideoAdFormat, "X") & If(IsBlank(g.AGOther), "", "_" & g.AGOther), " ", "-"))})},
              {r: ForAll(Filter(BriefAds, BriefID = varBrief.BriefID) As a, {Lvl: "AD", Ord: a.IONo * 100000000 + a.LineNo * 100000 + a.AGNo * 100 + a.AdNo, IONo: a.IONo, LineNo: a.LineNo, AGNo: a.AGNo, AdNo: a.AdNo, Indent: If(a.AGNo = 0, 2, 3), Bud: 0, Act: a.Action, DvId: a.DV360Id,
                  Label: If(IsBlank(a.Action), "", "[" & a.Action & "] ") & If(a.AGNo = 0, "Creative " & a.IONo & "." & a.LineNo & " #", "Ad " & a.IONo & "." & a.LineNo & "." & a.AGNo & " #") & a.AdNo & If(IsBlank(a.AdFormat), "", " · " & a.AdFormat) & If(IsBlank(a.CreativeSize), "", " · " & a.CreativeSize) & If(a.VideoLength > 0, " · " & a.VideoLength & "s", ""),
                  Detail: Coalesce(a.AssetURL, "") & "  →  " & Coalesce(a.LandingURL, "") & If(IsBlank(a.CTA), "", "  ·  CTA " & a.CTA) & If(IsBlank(a.Headline), "", "  ·  " & a.Headline) & If(IsBlank(a.Description), "", "  ·  " & a.Description),
                  Nm: a.AdName, Sug: Lower(Substitute(Coalesce(a.AssetDesc, "X") & "_" & Coalesce(a.AssetSource, "X") & "_" & Coalesce(a.AdFormat, "X") & "_" & If(a.VideoLength > 0, Text(a.VideoLength), "X") & "_" & Coalesce(a.CTACode, "X") & "_" & Coalesce(a.Skippable, "X") & "_" & Coalesce(a.AdBuyingType, "X") & "_" & Coalesce(a.Rotation, "X") & "_" & Switch(a.Redirect, "E-retailers", "e-" & a.Retailer, "Others", Coalesce(a.Retailer, "other"), "L'Oréal D2C", "d2c", "L'Oréal non-D2C", "non-d2c", "None", "noredirect", "X") & If(IsBlank(a.AdOther), "", "_" & a.AdOther), " ", "-"))})}
              ), r), Ord)}, If(varAOTodo, Filter(T, IsBlank(Nm) || IsBlank(Act) || (Act in ["Update", "Pause", "No change"] && IsBlank(DvId))), T))
            TemplateSize: =100
            Width: =Parent.Width - 396
            X: =12
            Y: =280
          Children:
            - aoLnSep:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(226, 229, 238, 1)
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1
            - aoLnInfo:
                Control: Label@2.5.1
                Properties:
                  Color: =Switch(ThisItem.Lvl, "IO", nfNavy, "LI", nfBlue, "AG", RGBA(74, 80, 112, 1), RGBA(40, 120, 90, 1))
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =24
                  Size: =10
                  Text: =Substitute(Substitute(ThisItem.Label, Char(13), " "), Char(10), " ")
                  Width: =Parent.TemplateWidth - 24 - ThisItem.Indent * 28
                  Wrap: =false
                  X: =12 + ThisItem.Indent * 28
                  Y: =6
            - aoLnName:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =If(IsBlank(ThisItem.Nm), RGBA(217, 140, 40, 1), RGBA(203, 208, 222, 1))
                  Default: =ThisItem.Nm
                  Font: =Font.'Segoe UI'
                  Height: =32
                  HintText: =Switch(ThisItem.Lvl, "IO", "Insertion order name", "LI", "Line item name", "AG", "Ad group name", "Ad name")
                  OnChange: |-
                    =If(
                        Self.Text <> ThisItem.Nm,
                        Switch(
                            ThisItem.Lvl,
                            "IO", With({r: LookUp(BriefIOs, BriefID = varBrief.BriefID && IONo = ThisItem.IONo)}, If(!IsBlank(r), Patch(BriefIOs, r, {IOName: Self.Text}))),
                            "LI", With({r: LookUp(BriefLines, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo)}, If(!IsBlank(r), Patch(BriefLines, r, {LineItemName: Self.Text}))),
                            "AG", With({r: LookUp(BriefAdGroups, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo && AGNo = ThisItem.AGNo)}, If(!IsBlank(r), Patch(BriefAdGroups, r, {AdGroupName: Self.Text}))),
                                With({r: LookUp(BriefAds, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo && AGNo = ThisItem.AGNo && AdNo = ThisItem.AdNo)}, If(!IsBlank(r), Patch(BriefAds, r, {AdName: Self.Text})))
                        )
                    )
                  Reset: =varAOReset
                  Size: =10
                  Width: =Parent.TemplateWidth - 24 - ThisItem.Indent * 28 - 296
                  X: =12 + ThisItem.Indent * 28
                  Y: =34
            - aoLnSug:
                Control: Label@2.5.1
                Properties:
                  Color: =If(ThisItem.Sug = ThisItem.Nm, RGBA(21, 128, 61, 1), RGBA(122, 128, 155, 1))
                  Font: =Font.'Segoe UI'
                  Height: =24
                  Size: =9
                  Text: |-
                    ="Suggested: " & ThisItem.Sug
                  Width: =Parent.TemplateWidth - 24 - ThisItem.Indent * 28 - 80
                  Wrap: =false
                  X: =12 + ThisItem.Indent * 28
                  Y: =70
            - aoLnUse:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =Color.White
                  Fill: =nfBlue
                  Font: =Font.'Segoe UI'
                  Height: =22
                  HoverFill: =ColorFade(Self.Fill, -15%)
                  OnSelect: |-
                    =Switch(
                        ThisItem.Lvl,
                        "IO", With({r: LookUp(BriefIOs, BriefID = varBrief.BriefID && IONo = ThisItem.IONo)}, If(!IsBlank(r), Patch(BriefIOs, r, {IOName: ThisItem.Sug}))),
                        "LI", With({r: LookUp(BriefLines, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo)}, If(!IsBlank(r), Patch(BriefLines, r, {LineItemName: ThisItem.Sug}))),
                        "AG", With({r: LookUp(BriefAdGroups, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo && AGNo = ThisItem.AGNo)}, If(!IsBlank(r), Patch(BriefAdGroups, r, {AdGroupName: ThisItem.Sug}))),
                        With({r: LookUp(BriefAds, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo && AGNo = ThisItem.AGNo && AdNo = ThisItem.AdNo)}, If(!IsBlank(r), Patch(BriefAds, r, {AdName: ThisItem.Sug})))
                    );
                    Set(varAOReset, true); Set(varAOReset, false)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =9
                  Text: ="Use"
                  Visible: =ThisItem.Sug <> ThisItem.Nm
                  Width: =64
                  X: =Parent.TemplateWidth - 76
                  Y: =71
            - aoLnAct:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AllowEmptySelection: =true
                  BorderColor: =If(IsBlank(ThisItem.Act), RGBA(217, 140, 40, 1), RGBA(203, 208, 222, 1))
                  Default: =ThisItem.Act
                  Font: =Font.'Segoe UI'
                  Height: =32
                  Items: =["New", "Update", "Pause", "No change"]
                  Items.Value: =Value
                  OnChange: |-
                    =If(Self.Selected.Value <> ThisItem.Act, Switch(
                        ThisItem.Lvl,
                        "IO", With({r: LookUp(BriefIOs, BriefID = varBrief.BriefID && IONo = ThisItem.IONo)}, If(!IsBlank(r), Patch(BriefIOs, r, {Action: Self.Selected.Value}))),
                        "LI", With({r: LookUp(BriefLines, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo)}, If(!IsBlank(r), Patch(BriefLines, r, {Action: Self.Selected.Value}))),
                        "AG", With({r: LookUp(BriefAdGroups, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo && AGNo = ThisItem.AGNo)}, If(!IsBlank(r), Patch(BriefAdGroups, r, {Action: Self.Selected.Value}))),
                        With({r: LookUp(BriefAds, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo && AGNo = ThisItem.AGNo && AdNo = ThisItem.AdNo)}, If(!IsBlank(r), Patch(BriefAds, r, {Action: Self.Selected.Value})))
                    ))
                  Reset: =varAOReset
                  Size: =10
                  Width: =112
                  X: =Parent.TemplateWidth - 290
                  Y: =34
            - aoLnId:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =If(ThisItem.Act in ["Update", "Pause", "No change"] && IsBlank(ThisItem.DvId), RGBA(217, 140, 40, 1), RGBA(203, 208, 222, 1))
                  Default: =ThisItem.DvId
                  Font: =Font.'Segoe UI'
                  Height: =32
                  HintText: =If(ThisItem.Act in ["Update", "Pause", "No change"], "DV360 ID (required)", "DV360 ID")
                  OnChange: |-
                    =If(Self.Text <> ThisItem.DvId, Switch(
                        ThisItem.Lvl,
                        "IO", With({r: LookUp(BriefIOs, BriefID = varBrief.BriefID && IONo = ThisItem.IONo)}, If(!IsBlank(r), Patch(BriefIOs, r, {DV360Id: Self.Text}))),
                        "LI", With({r: LookUp(BriefLines, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo)}, If(!IsBlank(r), Patch(BriefLines, r, {DV360Id: Self.Text}))),
                        "AG", With({r: LookUp(BriefAdGroups, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo && AGNo = ThisItem.AGNo)}, If(!IsBlank(r), Patch(BriefAdGroups, r, {DV360Id: Self.Text}))),
                        With({r: LookUp(BriefAds, BriefID = varBrief.BriefID && IONo = ThisItem.IONo && LineNo = ThisItem.LineNo && AGNo = ThisItem.AGNo && AdNo = ThisItem.AdNo)}, If(!IsBlank(r), Patch(BriefAds, r, {DV360Id: Self.Text})))
                    ))
                  Reset: =varAOReset
                  Size: =10
                  Width: =160
                  X: =Parent.TemplateWidth - 172
                  Y: =34
      - aoPanel:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(241, 243, 248, 1)
            Height: =Parent.Height - 64
            Width: =372
            X: =Parent.Width - 372
            Y: =64
      - aoPTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(16, 20, 61, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =14
            Text: ="Hand over to the Gate"
            Width: =330
            X: =Parent.Width - 352
            Y: =76
      - aoPInfo:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(16, 20, 61, 1)
            Font: =Font.'Segoe UI'
            Height: =90
            Size: =10
            Text: |-
              ="Sent to Ad Ops " & Text(varBrief.SentToAOAt, "dd mmm hh:mm") &
              "  ·  " & RoundDown(DateDiff(varBrief.SentToAOAt, Now(), TimeUnit.Minutes) / 60, 1) & " h ago (target " & nfAOTurnaroundHours & " h)" &
              If(varBrief.TaxonomyFixes > 0, "  ·  returned by the Gate " & varBrief.TaxonomyFixes & "×: " & varBrief.GateGaps, "")
            VerticalAlign: =VerticalAlign.Top
            Width: =330
            X: =Parent.Width - 352
            Y: =110
      - aoFill:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(16, 20, 61, 1)
            DisplayMode: =If(varBrief.Status = "With Ad Ops", DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =nfGreen
            Font: =Font.'Segoe UI'
            Height: =36
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: |-
              =Patch(BriefIOs, ForAll(Filter(BriefIOs, BriefID = varBrief.BriefID && IsBlank(IOName)) As i, {ID: i.ID, IOName: Lower(Substitute(Coalesce(LookUp(Brands, BrandName = varBrief.Brand).BrandCode, "X") & "_" & Coalesce(LookUp(nfCats, Name = varBrief.Category).Abv, "X") & "_" & Coalesce(varBrief.Franchise, "X") & "_" & Coalesce(varBrief.CampaignDesc, "X") & "_" & Coalesce(i.IOType, "X") & "-" & Coalesce(LookUp(nfObjs, Name = i.IOObjective).Abv, "X") & "-" & Coalesce(i.KPIModel, "X") & If(IsBlank(i.IOOther), "", "_" & i.IOOther), " ", "-"))}));
              Patch(BriefLines, ForAll(Filter(BriefLines, BriefID = varBrief.BriefID && IsBlank(LineItemName)) As l, {ID: l.ID, LineItemName: Lower(Substitute(Coalesce(l.DealType, "X") & If(l.DealType = "Youtube", "-" & Coalesce(l.YTLIType, "X"), "") & "_" & Coalesce(LookUp(nfAuds, Name = l.AudTargeting).AudType, "X") & "-" & Coalesce(LookUp(nfAuds, Name = l.AudTargeting).Abv, "X") & "_" & Coalesce(l.AudTactic, "X") & "_" & Coalesce(l.Gender, "X") & "_" & Coalesce(Text(l.AgeMin), "X") & "-" & Coalesce(Text(l.AgeMax), "X") & "_" & Coalesce(LookUp(nfLangs, Name = l.Language).Abv, "X") & "_" & Coalesce(LookUp(nfDevices, Name = l.Device).Abv, "X") & "_" & Coalesce(l.Environment, "X") & "_" & Coalesce(l.Dims, "X") & "_" & Coalesce(LookUp(nfSust, Name = l.Sustainability).Abv, "X") & If(l.ServiceDisc = "YES", "_SERVICE", "") & "_" & Coalesce(l.PublisherName, "X"), " ", "-"))}));
              Patch(BriefAdGroups, ForAll(Filter(BriefAdGroups, BriefID = varBrief.BriefID && IsBlank(AdGroupName)) As g, {ID: g.ID, AdGroupName: Lower(Substitute(Coalesce(LookUp(nfAuds, Name = g.AudTargeting).AudType, "X") & "-" & Coalesce(LookUp(nfAuds, Name = g.AudTargeting).Abv, "X") & "_" & Coalesce(g.AudTactic, "X") & "_" & Coalesce(g.Gender, "X") & "_" & Coalesce(Text(g.AgeMin), "X") & "-" & Coalesce(Text(g.AgeMax), "X") & "_" & Coalesce(LookUp(nfLangs, Name = g.Language).Abv, "X") & "_" & Coalesce(g.VideoAdFormat, "X") & If(IsBlank(g.AGOther), "", "_" & g.AGOther), " ", "-"))}));
              Patch(BriefAds, ForAll(Filter(BriefAds, BriefID = varBrief.BriefID && IsBlank(AdName)) As a, {ID: a.ID, AdName: Lower(Substitute(Coalesce(a.AssetDesc, "X") & "_" & Coalesce(a.AssetSource, "X") & "_" & Coalesce(a.AdFormat, "X") & "_" & If(a.VideoLength > 0, Text(a.VideoLength), "X") & "_" & Coalesce(a.CTACode, "X") & "_" & Coalesce(a.Skippable, "X") & "_" & Coalesce(a.AdBuyingType, "X") & "_" & Coalesce(a.Rotation, "X") & "_" & Switch(a.Redirect, "E-retailers", "e-" & a.Retailer, "Others", Coalesce(a.Retailer, "other"), "L'Oréal D2C", "d2c", "L'Oréal non-D2C", "non-d2c", "None", "noredirect", "X") & If(IsBlank(a.AdOther), "", "_" & a.AdOther), " ", "-"))}));
              If(
                  !(varBrief.BriefType in ["Extension", "Update"]),
                  Patch(BriefIOs, ForAll(Filter(BriefIOs, BriefID = varBrief.BriefID && IsBlank(Action)) As x, {ID: x.ID, Action: "New"}));
                  Patch(BriefLines, ForAll(Filter(BriefLines, BriefID = varBrief.BriefID && IsBlank(Action)) As x, {ID: x.ID, Action: "New"}));
                  Patch(BriefAdGroups, ForAll(Filter(BriefAdGroups, BriefID = varBrief.BriefID && IsBlank(Action)) As x, {ID: x.ID, Action: "New"}));
                  Patch(BriefAds, ForAll(Filter(BriefAds, BriefID = varBrief.BriefID && IsBlank(Action)) As x, {ID: x.ID, Action: "New"}))
              );
              If(IsBlank(varBrief.CampaignTaxonomy), Set(varBrief, Patch(Briefs, varBrief, {CampaignTaxonomy: Lower(Substitute(Coalesce(LookUp(Brands, BrandName = varBrief.Brand).BrandCode, "X") & "_" & Coalesce(LookUp(nfCats, Name = varBrief.Category).Abv, "X") & "_" & Coalesce(varBrief.Franchise, "X") & "_" & Coalesce(varBrief.CampaignDesc, "X") & If(IsBlank(varBrief.CampaignOther), "", "_" & varBrief.CampaignOther), " ", "-"))})); Reset(aoCamp));
              Set(varAOReset, true); Set(varAOReset, false);
              Notify("Blank names filled from the naming convention. Check any part shown as x.", NotificationType.Success)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: ="Fill blank names with suggestions"
            Width: =330
            X: =Parent.Width - 352
            Y: =210
      - aoFillHint:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(122, 128, 155, 1)
            Font: =Font.'Segoe UI'
            Size: =9
            Text: ="Names come from the planner inputs (x = missing). On a new brief, blank actions become New."
            Width: =330
            X: =Parent.Width - 352
            Y: =250
      - aoBType:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(16, 20, 61, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =22
            Size: =10
            Text: |-
              ="Brief type: " & Coalesce(varBrief.BriefType, "New") & If(varBrief.BriefType in ["Extension", "Update"], "  ·  changes start " & Text(varBrief.EffectiveDate, "dd mmm yy"), "") & If(varBrief.BrandLift = "Yes", "  ·  Brand lift ON", "")
            Width: =330
            Wrap: =false
            X: =Parent.Width - 352
            Y: =300
      - aoLCid:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(74, 80, 112, 1)
            Font: =Font.'Segoe UI'
            Height: =20
            Size: =9
            Text: |-
              ="DV360 campaign ID" & If(varBrief.BriefType in ["Extension", "Update"], " (required: existing campaign)", " (after you create it)")
            Width: =330
            X: =Parent.Width - 352
            Y: =326
      - aoCid:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =If(varBrief.BriefType in ["Extension", "Update"] && IsBlank(varBrief.DV360CampaignId), RGBA(217, 140, 40, 1), RGBA(203, 208, 222, 1))
            Default: =varBrief.DV360CampaignId
            Font: =Font.'Segoe UI'
            Height: =34
            HintText: ="e.g. 61234567"
            OnChange: |-
              =If(Self.Text <> varBrief.DV360CampaignId, Set(varBrief, Patch(Briefs, varBrief, {DV360CampaignId: Self.Text})))
            Size: =11
            Width: =330
            X: =Parent.Width - 352
            Y: =348
      - aoActCount:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(74, 80, 112, 1)
            Font: =Font.'Segoe UI'
            Height: =60
            Size: =9
            Text: |-
              =With(
                  {I: Filter(BriefIOs, BriefID = varBrief.BriefID), L: Filter(BriefLines, BriefID = varBrief.BriefID), G: Filter(BriefAdGroups, BriefID = varBrief.BriefID), A: Filter(BriefAds, BriefID = varBrief.BriefID)},
                  "Actions: " & (CountRows(Filter(I, Action = "New")) + CountRows(Filter(L, Action = "New")) + CountRows(Filter(G, Action = "New")) + CountRows(Filter(A, Action = "New"))) & " new  ·  " & (CountRows(Filter(I, Action = "Update")) + CountRows(Filter(L, Action = "Update")) + CountRows(Filter(G, Action = "Update")) + CountRows(Filter(A, Action = "Update"))) & " update  ·  " & (CountRows(Filter(I, Action = "Pause")) + CountRows(Filter(L, Action = "Pause")) + CountRows(Filter(G, Action = "Pause")) + CountRows(Filter(A, Action = "Pause"))) & " pause  ·  " &
                  (CountRows(Filter(I, IsBlank(Action))) + CountRows(Filter(L, IsBlank(Action))) + CountRows(Filter(G, IsBlank(Action))) + CountRows(Filter(A, IsBlank(Action)))) & " not set  ·  " & (CountRows(Filter(I, Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id))) + CountRows(Filter(L, Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id))) + CountRows(Filter(G, Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id))) + CountRows(Filter(A, Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id)))) & " missing DV360 ID"
              )
            VerticalAlign: =VerticalAlign.Top
            Width: =330
            X: =Parent.Width - 352
            Y: =392
      - aoDone:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =Color.White
            DisplayMode: =If(varBrief.Status = "With Ad Ops", DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =nfBlue
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =44
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: |-
              =If(
                  IsBlank(aoCamp.Text) ||
                  CountRows(Filter(BriefIOs, BriefID = varBrief.BriefID && IsBlank(IOName))) +
                  CountRows(Filter(BriefLines, BriefID = varBrief.BriefID && IsBlank(LineItemName))) +
                  CountRows(Filter(BriefAdGroups, BriefID = varBrief.BriefID && IsBlank(AdGroupName))) +
                  CountRows(Filter(BriefAds, BriefID = varBrief.BriefID && IsBlank(AdName))) > 0,
                  Notify("Needs a campaign name and a name for every IO, line item, ad group and ad.", NotificationType.Error),
                  CountRows(Filter(BriefIOs, BriefID = varBrief.BriefID && (IsBlank(Action) || (Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id))))) +
                  CountRows(Filter(BriefLines, BriefID = varBrief.BriefID && (IsBlank(Action) || (Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id))))) +
                  CountRows(Filter(BriefAdGroups, BriefID = varBrief.BriefID && (IsBlank(Action) || (Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id))))) +
                  CountRows(Filter(BriefAds, BriefID = varBrief.BriefID && (IsBlank(Action) || (Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id))))) > 0 ||
                  (varBrief.BriefType in ["Extension", "Update"] && IsBlank(varBrief.DV360CampaignId)),
                  With(
                      {I: Filter(BriefIOs, BriefID = varBrief.BriefID), L: Filter(BriefLines, BriefID = varBrief.BriefID), G: Filter(BriefAdGroups, BriefID = varBrief.BriefID), A: Filter(BriefAds, BriefID = varBrief.BriefID)},
                      With(
                          {na: CountRows(Filter(I, IsBlank(Action))) + CountRows(Filter(L, IsBlank(Action))) + CountRows(Filter(G, IsBlank(Action))) + CountRows(Filter(A, IsBlank(Action))), ni: CountRows(Filter(I, Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id))) + CountRows(Filter(L, Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id))) + CountRows(Filter(G, Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id))) + CountRows(Filter(A, Action in ["Update", "Pause", "No change"] && IsBlank(DV360Id)))},
                          Set(varAOTodo, true);
                          Notify(
                              "Not ready for the Gate. Missing: " &
                              Concat(
                                  Filter(
                                      Table(
                                          {t: If(varBrief.BriefType in ["Extension", "Update"] && IsBlank(varBrief.DV360CampaignId), "the DV360 campaign ID (extension)", "")},
                                          {t: If(na > 0, "an action on " & na & " rows", "")},
                                          {t: If(ni > 0, "a DV360 ID on " & ni & " Update / Pause / No change rows", "")}
                                      ),
                                      !IsBlank(t)
                                  ),
                                  t,
                                  "  ·  "
                              ) & ". Showing only the rows to fix. Tip: paste IDs from DV360 in the panel on the right.",
                              NotificationType.Error
                          )
                      )
                  ),
              Set(
                  varBrief,
                  Patch(
                      Briefs,
                      varBrief,
                      {
                          Status: "With Gatekeeper",
                          CampaignTaxonomy: aoCamp.Text,
                          TaxonomyDoneAt: Now(),
                          AdOpsEmail: nfMeEmail
                      }
                  )
              );
              Patch(BriefEvents, Defaults(BriefEvents), {BriefID: varBrief.BriefID, Event: "Taxonomy done", ByEmail: nfMeEmail, At: Now(), Detail: ""});
              If(nfSendEmails, IfError(Office365Outlook.SendEmailV2(Concat(Filter(DeskTeam, Role = "Gatekeeper"), Email, ";"), "Brief ready for the Gate: " & varBrief.BriefID & " · " & varBrief.Brand, "Taxonomy is done. Please run the Brief Gate check: " & varBrief.CampaignTaxonomy), Notify("Saved, but the email was not sent", NotificationType.Warning)));
              Notify("Sent to the Gate", NotificationType.Success);
              Navigate(scrHome, ScreenTransition.None)
              )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: ="Taxonomy done → Gate"
            Width: =330
            X: =Parent.Width - 352
            Y: =Parent.Height - 64
      - aoTodo:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(203, 208, 222, 1)
            BorderThickness: =1
            Color: =nfBlue
            Fill: =Color.White
            Font: =Font.'Segoe UI'
            Height: =30
            HoverFill: =RGBA(235, 238, 255, 1)
            OnSelect: =Set(varAOTodo, !varAOTodo)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: =If(varAOTodo, "Show all rows", "Show only rows to fix")
            Width: =330
            X: =Parent.Width - 352
            Y: =456
      - aoLPaste:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(74, 80, 112, 1)
            Font: =Font.'Segoe UI'
            Height: =34
            Size: =9
            Text: |-
              ="Paste DV360 IDs: one entity per line, name and ID (copy the table from DV360 or an SDF export)"
            VerticalAlign: =VerticalAlign.Top
            Width: =330
            X: =Parent.Width - 352
            Y: =494
      - aoPaste:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(203, 208, 222, 1)
            Default: =""
            Font: =Font.'Segoe UI'
            Height: =Parent.Height - 530 - 158
            HintText: ="cer_..._io_name    12345678"
            Mode: =TextMode.MultiLine
            Reset: =varAOPasteReset
            Size: =9
            Width: =330
            X: =Parent.Width - 352
            Y: =530
      - aoPasteGo:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =Color.White
            DisplayMode: =If(varBrief.Status = "With Ad Ops" && !IsBlank(aoPaste.Text), DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =nfBlue
            Font: =Font.'Segoe UI'
            Height: =32
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: |-
              =ClearCollect(
                  colAONames,
                  ForAll(Filter(BriefIOs, BriefID = varBrief.BriefID) As x, {n: Lower(x.IOName)}),
                  ForAll(Filter(BriefLines, BriefID = varBrief.BriefID) As x, {n: Lower(x.LineItemName)}),
                  ForAll(Filter(BriefAdGroups, BriefID = varBrief.BriefID) As x, {n: Lower(x.AdGroupName)}),
                  ForAll(Filter(BriefAds, BriefID = varBrief.BriefID) As x, {n: Lower(x.AdName)}),
                  {n: Lower(varBrief.CampaignTaxonomy)}
              );
              ClearCollect(
                  colIdPaste,
                  Filter(
                      ForAll(
                          Split(Substitute(aoPaste.Text, Char(13), ""), Char(10)) As ln,
                          With(
                              {f: Filter(ForAll(Split(Trim(ln.Value), If(IsBlank(Find(Char(9), ln.Value)), " ", Char(9))) As c, {v: Trim(c.Value)}), !IsBlank(v))},
                              {Id: First(Filter(f, IsMatch(v, "\d{5,}"))).v, Nm: Lower(LookUp(f, Lower(v) in colAONames.n).v)}
                          )
                      ),
                      !IsBlank(Id) && !IsBlank(Nm)
                  )
              );
              With(
                  {I: Filter(BriefIOs, BriefID = varBrief.BriefID), L: Filter(BriefLines, BriefID = varBrief.BriefID), G: Filter(BriefAdGroups, BriefID = varBrief.BriefID), A: Filter(BriefAds, BriefID = varBrief.BriefID)},
                  With(
                      {
                          mi: Filter(I, Lower(IOName) in colIdPaste.Nm && IsBlank(DV360Id)),
                          ml: Filter(L, Lower(LineItemName) in colIdPaste.Nm && IsBlank(DV360Id)),
                          mg: Filter(G, Lower(AdGroupName) in colIdPaste.Nm && IsBlank(DV360Id)),
                          ma: Filter(A, Lower(AdName) in colIdPaste.Nm && IsBlank(DV360Id)),
                          mc: !IsBlank(varBrief.CampaignTaxonomy) && Lower(varBrief.CampaignTaxonomy) in colIdPaste.Nm && IsBlank(varBrief.DV360CampaignId)
                      },
                      If(CountRows(mi) > 0, Patch(BriefIOs, ForAll(mi As x, {ID: x.ID, DV360Id: LookUp(colIdPaste, Nm = Lower(x.IOName)).Id})));
                      If(CountRows(ml) > 0, Patch(BriefLines, ForAll(ml As x, {ID: x.ID, DV360Id: LookUp(colIdPaste, Nm = Lower(x.LineItemName)).Id})));
                      If(CountRows(mg) > 0, Patch(BriefAdGroups, ForAll(mg As x, {ID: x.ID, DV360Id: LookUp(colIdPaste, Nm = Lower(x.AdGroupName)).Id})));
                      If(CountRows(ma) > 0, Patch(BriefAds, ForAll(ma As x, {ID: x.ID, DV360Id: LookUp(colIdPaste, Nm = Lower(x.AdName)).Id})));
                      If(mc, Set(varBrief, Patch(Briefs, varBrief, {DV360CampaignId: LookUp(colIdPaste, Nm = Lower(varBrief.CampaignTaxonomy)).Id})); Reset(aoCid));
                      Notify(
                          CountRows(colIdPaste) & " pasted lines matched a name here. Filled " & (CountRows(mi) + CountRows(ml) + CountRows(mg) + CountRows(ma) + If(mc, 1, 0)) &
                          " DV360 IDs (IO " & CountRows(mi) & " · LI " & CountRows(ml) & " · AG " & CountRows(mg) & " · ad " & CountRows(ma) & If(mc, " · campaign", "") & "). Rows that already had an ID were left alone.",
                          If(CountRows(mi) + CountRows(ml) + CountRows(mg) + CountRows(ma) + If(mc, 1, 0) > 0, NotificationType.Success, NotificationType.Warning)
                      )
                  )
              );
              Set(varAOPasteReset, true); Set(varAOPasteReset, false);
              Set(varAOReset, true); Set(varAOReset, false)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: ="Match IDs by name"
            Width: =330
            X: =Parent.Width - 352
            Y: =Parent.Height - 150
      - aoHint:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(122, 128, 155, 1)
            Font: =Font.'Segoe UI'
            Height: =30
            Size: =9
            Text: ="Needs names, an action on every row, and DV360 IDs for anything that already exists."
            Width: =330
            X: =Parent.Width - 352
            Y: =Parent.Height - 100
