            Text: |-
              =Switch(
                  true,
                  varConfirmRecall, "Ad Ops and the Gate stop work on this brief while you edit. Submitting it again counts as 1 resubmission on your scorecard.",
                  varTestMode && varBrief.Status in ["Draft", "Returned"], "Test mode is ON: submit skips the checks and lead time.",
                  varBrief.Status = "Draft" && !IsBlank(varBrief.SubmittedAt) && (varBrief.PlannerEmail = nfMeEmail || nfRole = "Admin"), "Submitted before: submitting again counts as 1 resubmission on your scorecard.",
                  varBrief.Status in ["Draft", "Returned"] && (varBrief.PlannerEmail = nfMeEmail || nfRole = "Admin"), If(rvOpen.Text = "0", "Will be sent to Ad Ops for taxonomy.", "Fix the open checks first (Edit brief)."),
                  varBrief.Status in ["With Ad Ops", "With Gatekeeper"] && (varBrief.PlannerEmail = nfMeEmail || nfRole = "Admin"), "Viewing only. Edit brief pulls it back to you; nothing counts until you submit again.",
                  varBrief.Status in ["Locked", "In set-up", "Set up"], "Locked brief. Changes go through Request a change (major change = new version).",
                  "Viewing only."
              )
