              =Switch(
                  true,
                  varBrief.Status = "With Ad Ops" && nfIsAdOps, Navigate(scrAdOps, ScreenTransition.None),
                  varBrief.Status = "With Gatekeeper" && nfIsGate, Navigate(scrGate, ScreenTransition.None),
