            Color: =If(varConfirmRecall || (varBrief.Status = "Draft" && !IsBlank(varBrief.SubmittedAt)), RGBA(180, 100, 0, 1), If(varTestMode, RGBA(196, 40, 40, 1), RGBA(122, 128, 155, 1)))
