      - rvBackEdit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(203, 208, 222, 1)
            BorderThickness: =1
            Color: =If(varConfirmRecall, Color.White, nfNavy)
            Fill: =If(varConfirmRecall, RGBA(217, 140, 40, 1), Color.White)
            Font: =Font.'Segoe UI'
            HoverFill: =If(varConfirmRecall, RGBA(190, 120, 30, 1), RGBA(241, 243, 248, 1))
            OnSelect: |-
              =Switch(
                  true,
                  varBrief.Status in ["Draft", "Returned"] && (varBrief.PlannerEmail = nfMeEmail || nfRole = "Admin"), Navigate(scrBrief, ScreenTransition.None),
                  varBrief.Status in ["With Ad Ops", "With Gatekeeper"] && (varBrief.PlannerEmail = nfMeEmail || nfRole = "Admin"), If(
                  !varConfirmRecall,
                  Set(varConfirmRecall, true),
                  Set(varBrief, Patch(Briefs, varBrief, {Status: "Draft"}));
                  Patch(BriefEvents, Defaults(BriefEvents), {BriefID: varBrief.BriefID, Event: "Pulled back by planner to edit", ByEmail: nfMeEmail, At: Now(), Detail: "Resubmitting will count as a resubmission"});
                  If(nfSendEmails, IfError(Office365Outlook.SendEmailV2(Concat(Filter(DeskTeam, Role = "Ad Ops" || Role = "Gatekeeper"), Email, ";"), "Brief pulled back for edits: " & varBrief.BriefID, "The planner is editing this brief. Please pause work on it until it is submitted again."), Notify("Saved, but the email was not sent", NotificationType.Warning)));
                  Set(varConfirmRecall, false);
                  Navigate(scrBrief, ScreenTransition.None)
              ),
                  varBrief.Status in ["Locked", "In set-up", "Set up"] && (varBrief.PlannerEmail = nfMeEmail || nfRole = "Admin"), Navigate(scrDetail, ScreenTransition.None),
                  Navigate(scrHome, ScreenTransition.None)
              )
