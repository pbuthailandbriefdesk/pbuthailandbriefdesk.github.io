            Width: =260
            X: =Parent.Width - 284
            Y: =Parent.Height - 58
      - rvSubmit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =If(rvOpen.Text = "0", nfNavy, Color.White)
            Fill: =If(rvOpen.Text = "0", nfGreen, nfBlue)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =44
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: |-
              =If(
                  !varTestMode && Value(rvOpen.Text) > 0,
                  Notify("Not ready: fix the checks marked ✗ first.", NotificationType.Error),
                  !varTestMode && Value(rvLeadVal.Text) < nfMinLeadDays && !(varBrief.IsException = "Yes" && !IsBlank(varBrief.ExceptionApprover)),
                  Notify("Lead time is under " & nfMinLeadDays & " working days. Record an approved exception first.", NotificationType.Error),
              Set(
                  varBrief,
                  Patch(
                      Briefs,
                      varBrief,
                      {
                          Status: "With Ad Ops",
                          SubmittedAt: Now(),
                          SentToAOAt: Now(),
                          LeadTimeWD: Value(rvLeadVal.Text),
                          GateGaps: "",
                          Resubmits: Coalesce(varBrief.Resubmits, 0) + If(varBrief.Status = "Draft" && !IsBlank(varBrief.SubmittedAt), 1, 0)
                      }
                  )
              );
              Patch(BriefEvents, Defaults(BriefEvents), {BriefID: varBrief.BriefID, Event: If(varBrief.GateAttempts > 0 || varBrief.Resubmits > 0, "Resubmitted", "Submitted") & If(varTestMode, " (test mode)", ""), ByEmail: nfMeEmail, At: Now(), Detail: "Lead time " & rvLeadVal.Text & " working days" & If(varTestMode, "  ·  open checks: " & Value(rvOpen.Text), "")});
              If(nfSendEmails, IfError(Office365Outlook.SendEmailV2(Concat(Filter(DeskTeam, Role = "Ad Ops"), Email, ";"), "Brief for taxonomy: " & varBrief.BriefID & " · " & varBrief.Brand, "A brief is waiting for taxonomy in the L'Oréal Brief Desk: " & Coalesce(varBrief.CampaignName, varBrief.BriefID)), Notify("Saved, but the email was not sent", NotificationType.Warning)));
              Notify("Sent to Ad Ops", NotificationType.Success);
              Navigate(scrHome, ScreenTransition.None)
              )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: =If(rvOpen.Text = "0", "Submit to Ad Ops  →", "Submit to Ad Ops (" & rvOpen.Text & " open)")
            Visible: =varBrief.Status in ["Draft", "Returned"] && (varBrief.PlannerEmail = nfMeEmail || nfRole = "Admin")
            Width: =260
            X: =Parent.Width - 284
            Y: =Parent.Height - 58
