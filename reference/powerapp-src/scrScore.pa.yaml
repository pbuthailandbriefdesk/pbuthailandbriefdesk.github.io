Screens:
  scrScore:
    Properties:
      Fill: =RGBA(247, 248, 251, 1)
      Height: =Max(App.Height, 560)
      OnVisible: |-
        =With(
            {m0: Date(Value(Left(scMonth.Selected.Value, 4)), Value(Right(scMonth.Selected.Value, 2)), 1)},
            ClearCollect(
                colScore,
                Filter(Briefs, SubmittedAt >= m0 && SubmittedAt < DateAdd(m0, 1, TimeUnit.Months) && Status <> "Cancelled")
            )
        )
      Width: =Max(App.Width, 1024)
    Children:
      - scHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Color.White
            Height: =64
            Width: =Parent.Width
      - scHeaderLine:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =nfGreen
            Height: =3
            Width: =Parent.Width
            Y: =61
      - scHeaderMark:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =nfNavy
            Height: =61
            Width: =4
      - scTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(16, 20, 61, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Size: =17
            Text: ="Scorecards"
            Width: =Parent.Width - 460
            X: =If(true, 64, 24)
            Y: =12
      - scUser:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(122, 128, 155, 1)
            Font: =Font.'Segoe UI'
            Height: =24
            Size: =10
            Text: =User().FullName & "  ·  " & nfRole
            Width: =320
            X: =Parent.Width - 344
            Y: =20
      - scBack:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Back"
            Color: =RGBA(16, 20, 61, 1)
            Height: =32
            Icon: =Icon.ChevronLeft
            OnSelect: =Back()
            Width: =32
            X: =16
            Y: =16
      - scLMonth:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(74, 80, 112, 1)
            Font: =Font.'Segoe UI'
            Height: =20
            Size: =10
            Text: ="Month (by submit date)"
            Width: =220
            X: =24
            Y: =76
      - scMonth:
          Control: Classic/DropDown@2.3.1
          Properties:
            Font: =Font.'Segoe UI'
            Height: =36
            Items: =ForAll(Sequence(12, 0) As m, Text(DateAdd(Today(), -m.Value, TimeUnit.Months), "yyyy-mm"))
            Items.Value: =Value
            OnChange: |-
              =With(
                  {m0: Date(Value(Left(scMonth.Selected.Value, 4)), Value(Right(scMonth.Selected.Value, 2)), 1)},
                  ClearCollect(
                      colScore,
                      Filter(Briefs, SubmittedAt >= m0 && SubmittedAt < DateAdd(m0, 1, TimeUnit.Months) && Status <> "Cancelled")
                  )
              )
            Size: =11
            Width: =220
            X: =24
            Y: =98
      - scLTeam:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(74, 80, 112, 1)
            Font: =Font.'Segoe UI'
            Height: =20
            Size: =10
            Text: ="Planner team"
            Width: =220
            X: =260
            Y: =76
      - scTeam:
          Control: Classic/DropDown@2.3.1
          Properties:
            Font: =Font.'Segoe UI'
            Height: =36
            Items: =["All", "CPD", "Non-CPD"]
            Items.Value: =Value
